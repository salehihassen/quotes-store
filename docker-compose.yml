services:
  quotes:
    build: .
    image: quotes:0.3.0
    container_name: quotes
    restart: unless-stopped
    env_file: .env
    ports:
      - "${QUOTES_PORT:-8088}:8000"
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').read()==b'ok' else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # The network the existing `postgres` container already sits on, so the app
  # can reach it by hostname. Created outside this compose project.
  postgres:
    external: true
    name: opt_default
