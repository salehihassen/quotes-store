{% extends "base.html" %}
{% block content %}
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="mark">&ldquo;</span>
      <div>
        <h1>Quotes</h1>
        <p class="tagline">Words worth keeping.</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn ghost icon" onclick="toggleTheme()" title="Toggle theme"
              aria-label="Toggle light and dark theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
      </button>
      <button class="btn primary" hx-get="/quotes/new" hx-target="#composer"
              hx-swap="innerHTML" hx-on::after-request="document.getElementById('quote-input')?.focus()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add quote
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="searchbar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" class="search-icon">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="search" name="q" type="search" value="{{ search }}"
           placeholder="Search quotes, authors, sources&hellip;" autocomplete="off"
           hx-get="/quotes" hx-target="#board" hx-swap="innerHTML"
           hx-trigger="input changed delay:250ms, search"
           hx-include="#tagfilter">
  </div>

  <div id="composer"></div>

  <div id="board">
    {% include "partials/board.html" %}
  </div>
</main>

<footer class="wrap foot">
  <span>Stored in Postgres &middot; <code>{{ stats.quotes }}</code> quotes and counting</span>
</footer>
{% endblock %}
